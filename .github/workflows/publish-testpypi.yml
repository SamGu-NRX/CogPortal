name: Publish CogWorks CLI to TestPyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade build twine
      - run: python -m build python/cogbench --outdir dist
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v5
        with:
          name: cogworks-benchmark-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/cogworks-benchmark
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: cogworks-benchmark-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
