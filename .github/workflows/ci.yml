name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: pnpm/action-setup@f68f5791346aaeb8b9d7ea636c1bcf61c15511ed # v6.0.2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter @cogworks/contracts test
      - run: pnpm --filter @cogworks/discord-bot test
      - run: pnpm --filter @cogworks/portal test
      - run: pnpm db:migrate:local
      - run: pnpm build

  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.8"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.8"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e python/cogbench
      - run: python -m unittest discover -s python/cogbench/tests -p 'test_*.py'
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: python -m unittest discover -s apps/runner-modal/tests -p 'test_*.py'
      - run: python template-catalog/validate.py
      - run: python -m build python/cogbench --outdir wheelhouse
      - run: python -m pip install --no-index --find-links wheelhouse --force-reinstall cogworks-benchmark
      - run: python -m pip check
      - run: cogworks --version
      - run: cogworks --help

  week2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install -e python/cogbench
          -e "benchmarks/week2[test,data]"
          -e "benchmarks/week2/face_recognition_app[test]"
          numpy==1.24.4 Pillow==10.2.0 torch==2.2.2 torchvision==0.17.2
          facenet-pytorch==2.6.0 opencv-python-headless==4.10.0.84
          "facenet_models @ git+https://github.com/CogWorksBWSI/facenet_models.git@96b9599b03f26910b66f61ce725a8660e0ba654c"
      - run: python scripts/validate_week2_submodule.py
      - run: pytest benchmarks/week2/tests
      - run: python -m unittest discover -s python/cogbench/tests -p 'test_*.py'
      - run: python -m unittest discover -s apps/runner-modal/tests -p 'test_*.py'
      - run: cogworks check --benchmark vision-recognition --json
      - run: cogworks check --benchmark vision-clustering --json

  week3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install -e python/cogbench
          -e "benchmarks/week3[test]"
          -e examples/week3-language-submission
      - run: python scripts/validate_week3_submodule.py
      - run: python -m ruff check benchmarks/week3/language_search_benchmark benchmarks/week3/tools
      - run: pytest benchmarks/week3/tests
      # The only lane with language_search_benchmark installed, so the only
      # one where test_week3_payload actually runs instead of skipping. It
      # guards the property that matters most here: gold never reaches the
      # sandbox payload.
      - run: python -m unittest discover -s apps/runner-modal/tests -p 'test_*.py'
      - run: cogworks check --benchmark language-search --json

  week1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install -e python/cogbench
          -e "benchmarks/week1[test]"
          -e examples/week1-audio-submission
      - run: python scripts/validate_week1_submodule.py
      - run: python -m ruff check benchmarks/week1/audio_identification_benchmark benchmarks/week1/tools
      - run: pytest benchmarks/week1/tests
      # Corpus rendering must be bit-identical here and in the sandbox, or
      # every hosted run fails its integrity check. This lane is the only
      # place a non-macOS libm sees the renderer before Modal does.
      - run: python -m unittest discover -s apps/runner-modal/tests -p 'test_*.py'
      - run: cogworks check --benchmark audio-identification --json
