name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@0609f0983b7a228f052f81ef4c3d6510cae254ad
        with:
          version: 10.30.3
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter @cogworks/contracts test
      - run: pnpm --filter @cogworks/discord-bot test
      - run: pnpm db:migrate:local
      - run: pnpm build

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e python/cogbench -e benchmarks/vision-recognition
      - run: python -m unittest discover -s python/cogbench/tests -p 'test_*.py'
      - run: python -m unittest discover -s benchmarks/vision-recognition/tests -p 'test_*.py'
      - if: matrix.python-version == '3.11'
        run: python -m unittest discover -s apps/runner-modal/tests -p 'test_*.py'
      - run: python template-catalog/validate.py
      - run: cogbench --version
