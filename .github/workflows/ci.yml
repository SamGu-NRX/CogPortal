name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@f68f5791346aaeb8b9d7ea636c1bcf61c15511ed # v6.0.2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter @cogworks/contracts test
      - run: pnpm --filter @cogworks/discord-bot test
      - run: pnpm db:migrate:local
      - run: pnpm build

  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.8"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.8"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e python/cogbench -e benchmarks/vision-recognition -e examples/week2-vision-submission
      - run: python -m unittest discover -s python/cogbench/tests -p 'test_*.py'
      - run: python -m unittest discover -s benchmarks/vision-recognition/tests -p 'test_*.py'
      - run: python -m unittest discover -s examples/week2-vision-submission/tests -p 'test_*.py'
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: python -m unittest discover -s apps/runner-modal/tests -p 'test_*.py'
      - run: python template-catalog/validate.py
      - run: cogbench --version
      - run: cogbench doctor --benchmark vision-recognition
      - run: cogbench test --benchmark vision-recognition
      - run: cogbench run --benchmark vision-recognition
      - run: cogbench report
