name: Review queue

# CodeRabbit's free tier refuses a review when the account is over its hourly
# allowance and records the refusal as a passing commit status, so an unreviewed head
# looks fine and stays unreviewed. This asks again, a few pull requests at a time.
# docs/runbooks/review-bots.md explains what the queue decides and why.

on:
  schedule:
    # Roughly hourly, off the :00 mark where scheduled runs pile up and GitHub delays them.
    - cron: '13 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Decide and log without commenting
        type: boolean
        default: true
      only_pr:
        description: Restrict the run to one pull request number
        type: string
        default: ''

permissions:
  contents: read
  statuses: read
  pull-requests: write

concurrency:
  group: review-queue
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # CodeRabbit ignores commands from github-actions[bot]. Measured on pull request #4
      # on 2026-09-17: the built-in GITHUB_TOKEN posted "@coderabbitai review" at 11:00:31Z
      # and CodeRabbit never acknowledged it; the identical comment from a user account at
      # 11:11:25Z was acknowledged at 11:11:33Z and the head went to "Review in progress" at
      # 11:11:35Z. Without the PAT this job would post comments nothing acts on, so it stops
      # instead. Reading statuses does not depend on identity, so dry runs are exempt.
      - name: Require a posting identity CodeRabbit listens to
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          REVIEW_QUEUE_TOKEN: ${{ secrets.REVIEW_QUEUE_TOKEN }}
        run: |
          if [ -z "$REVIEW_QUEUE_TOKEN" ]; then
            echo "::error::Set the REVIEW_QUEUE_TOKEN secret to a fine-grained PAT on a user account, scoped to this repository, with pull requests read and write plus contents read. See docs/runbooks/review-bots.md."
            exit 1
          fi

      - name: Request reviews
        env:
          GH_TOKEN: ${{ secrets.REVIEW_QUEUE_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
          ONLY_PR: ${{ inputs.only_pr }}
        run: node scripts/review-queue.mjs
