[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cogworks-benchmark"
# 0.2.0 changes the check report; 0.1.0 is already published on TestPyPI.
# Setuptools reads the version from the imported source so an unrelated
# installed distribution cannot mislabel this checkout.
dynamic = ["version"]
description = "Offline-first CogWorks benchmark SDK and CLI"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "CogWorks" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
cogworks = "cogbench.cli:main"

[project.urls]
Repository = "https://github.com/CogWorksBWSI/CogPortal"
Issues = "https://github.com/CogWorksBWSI/CogPortal/issues"

[tool.setuptools.dynamic]
version = { attr = "cogbench.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cogbench = ["py.typed"]
