[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cogworks-benchmark"
# 0.2.0: `cogworks check` answers a different question from the one 0.1.0
# answered, and 0.1.0 is already on TestPyPI, where an index refuses a second
# upload of one version. Publishing is `publish-testpypi.yml`, dispatched by
# hand.
version = "0.2.0"
description = "Offline-first CogWorks benchmark SDK and CLI"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "CogWorks" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
cogworks = "cogbench.cli:main"

[project.urls]
Repository = "https://github.com/CogWorksBWSI/CogPortal"
Issues = "https://github.com/CogWorksBWSI/CogPortal/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cogbench = ["py.typed"]
