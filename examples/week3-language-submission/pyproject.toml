[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cogworks-week3-language-submission"
version = "0.1.0"
description = "Reference submission used to validate the Week 3 language benchmark harness"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = ["numpy>=1.24,<2", "gensim>=4.3,<4.4"]

[project.entry-points."cogworks.submissions.v2"]
language-search = "benchmark_adapter:create_search_adapter"

[tool.setuptools]
py-modules = ["benchmark_adapter"]
packages = ["reference_search"]
